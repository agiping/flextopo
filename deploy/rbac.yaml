apiVersion: v1
kind: ServiceAccount
metadata:
  name: flextopo-fake-deployment
  namespace: evaluation-flex-topo

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flextopo-fake-deployment
rules:
  - apiGroups: ["flextopo.baichuan-inc.com"]
    resources: ["flextopos"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flextopo-fake-deployment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flextopo-fake-deployment
subjects:
  - kind: ServiceAccount
    name: flextopo-fake-deployment
    namespace: evaluation-flex-topo